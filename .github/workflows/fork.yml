# CI for the epheo fork: unit tests on every PR, amd64 image (Dockerfile.centos) to ghcr.io on master and tags.
# Hosted runners only: a self-hosted runner on a public repo would run any PR's code.
# Not pushed to an in-cluster registry: that registry's storage would come from this driver.
name: fork CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
    # What .dockerignore lets into the image: any other change would publish a
    # new version of the same image, and Renovate would roll it out.
    # (Ignored for tag pushes.)
    paths:
      - bin/**
      - csi_proto/**
      - csi_proxy_proto/**
      - docker/**
      - LICENSE
      - package*.json
      - src/**
      - Dockerfile.centos
      - .dockerignore
  # upstream-sync.yml runs CI on its branches this way
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: syntax check
        run: |
          node --check bin/democratic-csi
          git ls-files 'src/*.js' | xargs -n1 node --check

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # v<upstream>-epheo.<commits since it>: an orderable tag per master build, for Renovate
      - id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          base=$(cat .upstream-version)
          git fetch -q --no-tags https://github.com/democratic-csi/democratic-csi.git "refs/tags/$base:refs/tags/$base"
          echo "tag=$base-epheo.$(git rev-list --count "$base..HEAD")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # also overrides the Dockerfile's upstream source label so ghcr links the package to this fork
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.centos
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the app loads every driver, native modules included, before parsing args
      - name: smoke test
        if: github.event_name != 'push'
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm "$IMAGE" --version
          docker run --rm --entrypoint sh "$IMAGE" -c 'for t in mkfs.xfs mkfs.ext4 xfs_growfs resize2fs mount.nfs blkid lsblk findmnt; do command -v $t >/dev/null || { echo "missing $t"; exit 1; }; done'
      - if: github.event_name == 'push'
        run: echo "pin as ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # a GitHub release per versioned image; its tag, made with GITHUB_TOKEN, starts no new run
  release:
    needs: image
    if: needs.image.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.image.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            --notes "$(printf 'Image: `%s`\n\nPin by digest: `%s`\n' "$IMAGE:$TAG" "$IMAGE@$DIGEST")"
